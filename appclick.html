<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="appclick.css"/>
    <link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="container">
        <div class="left-panel">
            <img class="logo-icon" src="https://appclick.ng/portal/uploads/school_content/admin_logo/1692202493-89741823864dcf5fd4617b!appclick-academy-logo-best-tech-training-center-in-ibadan-lagos-nigeria (1).png" 
            alt="logo">
            <form class="login-form">
            <p>User Login</p>
            <div class="form-group">
                <input type="text" placeholder="Username"/>
                <span class="form-icon"><i class="fa-solid fa-envelope"></i></span>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password"/>
                <span class="form-icon"><i class="fa-solid fa-lock"></i></span>
            </div>
            <button class="signin-btn" type="submit">Sign In</button>
            <span class="key-btn"><i class="fa-solid fa-key"></i></span>
            <a href="password recovery" class="forgot">Forgot Password?</a>
        </form>
        </div>

        <div class="right-panel">
            <img src="assets/Coding-World-with-These-Programming-Laptop-2.jpg" alt="">
        </div>
    </section>
</body>
</html>
